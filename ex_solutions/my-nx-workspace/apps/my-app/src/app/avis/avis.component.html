<h3>avis sur ngrx</h3>
<!-- listeAvis: {{ listeAvis$ | async | json }} -->
 <ul>
 @let avisState = avisState$ | async;
 moyenne : {{avisState?.moyenne}} <br/>
 @for(a of avisState?.listeAvis ; track a){
   <li>[num={{a.num}}] <b>{{a.note}}/5</b> : {{a.commentaire}} 
       <button (click)="onDeleteAvis(a.num)">delete</button>
  </li>
  }
 </ul>
<hr/>
commentaire:<input [(ngModel)]="avis.commentaire" size="48"/><br>
note:<select [(ngModel)]="avis.note">
    <option>1</option><option>2</option><option>3</option><option>4</option><option>5</option>
</select> &nbsp; &nbsp; <button (click)="onAddAvis()">add</button>
